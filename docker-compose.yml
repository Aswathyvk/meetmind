services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/meetmind.db:/app/meetmind.db

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend